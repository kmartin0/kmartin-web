<app-toolbar title="Home" [titleLink]="AppEndpoints.home()"/>

<div class="home-page-content">
  <div class="header">
    <mat-icon class="face-icon">face</mat-icon>

    <div class="intro">
      <p class="title">Hi, I'm Kevin Martin</p>
      <p class="subtitle">Welcome to my website</p>
    </div>
  </div>

  <div class="icons-container">
    @for (link of SOCIAL_LINKS; track link.icon) {
      <a [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="link.name">
        <mat-icon class="medium-icon" [svgIcon]="link.icon" [matTooltip]="link.name"></mat-icon>
      </a>
    }
  </div>

  <a
    class="projects-button"
    matButton="outlined"
    [routerLink]="AppEndpoints.projects()">
    <mat-icon></mat-icon>
    Open projects
    <mat-icon iconPositionEnd>arrow_forward</mat-icon>
  </a>

</div>
