<app-toolbar title="Home" [titleLink]="AppEndpoints.home()"/>

<div class="home-page-content">
  <div class="header">
    <mat-icon class="icon-extra-large icon-filled">face</mat-icon>

    <div class="intro">
      <p class="title">Hi, I'm Kevin Martin</p>
      <p class="subtitle">Welcome to my website</p>
    </div>
  </div>

  <div class="icons-container">
    @for (link of SOCIAL_LINKS; track link.icon.id) {
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="link.icon.name">
        <mat-icon
          class="icon-large social-icon"
          [svgIcon]="link.icon.id"
          [matTooltip]="link.icon.name"/>
      </a>
    }
  </div>

  <a
    class="projects-button"
    matButton="outlined"
    [routerLink]="AppEndpoints.projects()">
    <mat-icon></mat-icon>
    Open projects
    <mat-icon iconPositionEnd>arrow_forward</mat-icon>
  </a>
</div>
