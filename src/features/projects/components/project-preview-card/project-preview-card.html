@let projectData = project();

<a
  class="plain"
  [routerLink]="AppEndpoints.project(projectData.id)">

  <mat-card class="project-card">
    <!-- Project title -->
    <h3 class="title">{{ projectData.title }}</h3>

    <!-- Project preview image -->
    @if (projectData.previewImage; as previewImage) {
      <img
        class="preview-image"
        [src]="previewImage.url"
        [alt]="previewImage.name"
        [width]="previewImage.width"
        [height]="previewImage.height">
    } @else {
      <div class="preview-placeholder">
        <mat-icon class="preview-placeholder-icon">terminal</mat-icon>
      </div>
    }

    <!-- Project technology icons -->
    @if (projectData.technologies.length > 0) {
      <div class="technologies">
        @for (technology of projectData.technologies; track technology.id) {
          <mat-icon
            class="icon-medium"
            [svgIcon]="technology.id"
            [matTooltip]="technology.name"/>
        }
      </div>
    }
  </mat-card>
</a>
